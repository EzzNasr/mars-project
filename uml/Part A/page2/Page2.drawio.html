getResourceRequirement() ResourceRequirement\\n        +getRequiredCapabilities() Set~Capability~\\n        +getRequiredSkill() Skill\\n        +getMinBatteryPercent() int\\n        +getRequiredEquipment() List~String~\\n        +requiresCommunication() boolean\\n        +requiresSurface() boolean\\n        +getStartBlockReason(EnvironmentCondition env) String\\n        +getInProgressFailureReason(EnvironmentCondition env) String\\n        +assign(List~Agent~ agents) void\\n        +start() void\\n        +advance() void\\n        +fail(String reason) void\\n        +isFinished() boolean\\n        +describe() String\\n    }\\n\\n    class AbstractMission {\\n        &amp;lt;&amp;lt;abstract&amp;gt;&amp;gt;\\n        -id : String\\n        -type : MissionType\\n        -durationUnits : int\\n        -state : MissionState\\n        -progressUnits : int\\n        -failureReason : String\\n        -assignedAgents : List~Agent~\\n        -targetFacilities : List~Facility~\\n        -resourceRequirement : ResourceRequirement\\n        #AbstractMission(...)\\n        #onComplete() void\\n    }\\n    Mission &amp;lt;|.. AbstractMission\\n\\n    class ExplorationMission {\\n        -regionName : String\\n        +ExplorationMission(...)\\n        +getRegionName() String\\n    }\\n    class RepairMission {\\n        +RepairMission(...)\\n    }\\n    class ResearchMission {\\n        +ResearchMission(...)\\n    }\\n    class RescueMission {\\n        +RescueMission(...)\\n    }\\n    AbstractMission &amp;lt;|-- ExplorationMission\\n    AbstractMission &amp;lt;|-- RepairMission\\n    AbstractMission &amp;lt;|-- ResearchMission\\n    AbstractMission &amp;lt;|-- RescueMission\\n\\n    class AllocationPolicy {\\n        &amp;lt;&amp;lt;interface&amp;gt;&amp;gt;\\n        +order(List~Facility~ operationalFacilities, ResourceType type) List~Facility~\\n    }\\n    class StorageFirstPolicy {\\n        +order(List~Facility~ operationalFacilities, ResourceType type) List~Facility~\\n    }\\n    AllocationPolicy &amp;lt;|.. StorageFirstPolicy\\n\\n    class SubmissionResult {\\n        +accepted(Mission mission)$ SubmissionResult\\n        +rejected(Mission mission, String reason)$ SubmissionResult\\n        +isAccepted() boolean\\n        +getReason() String\\n        +getMission() Mission\\n        +toString() String\\n    }\\n\\n    class ResourceManager {\\n        +String RESPONSIBILITY = \\&amp;quot;Manages facility inventory and resource consumption.\\&amp;quot;\\n        -facilities : List~Facility~\\n        -policy : AllocationPolicy\\n        +ResourceManager(List~Facility~ facilities, AllocationPolicy policy)\\n        +setPolicy(AllocationPolicy policy) void\\n        +getTotal(ResourceType type) int\\n        +getAllTotals() Map~ResourceType, Integer~\\n        +canSupply(ResourceRequirement requirement) boolean\\n        +explainShortage(ResourceRequirement requirement) String\\n        +consume(ResourceRequirement requirement) boolean\\n    }\\n    ResourceManager --&amp;gt; AllocationPolicy\\n\\n    class MarsColony {\\n        +String RESPONSIBILITY = \\&amp;quot;Core colony hub coordinating resources and missions.\\&amp;quot;\\n        -name : String\\n        -agents : List~Agent~\\n        -facilities : List~Facility~\\n        -resourceManager : ResourceManager\\n        -environment : Environment\\n        -activeMission : Mission\\n        -missionHistory : List~Mission~\\n        -eventLog : List~String~\\n        +MarsColony(String name, AllocationPolicy policy)\\n        +MarsColony(String name)\\n        +getName() String\\n        +addAgent(Agent agent) void\\n        +addFacility(Facility facility) void\\n        +getAgents() List~Agent~\\n        +getFacilities() List~Facility~\\n        +findFacility(String name) Facility\\n        +findAgent(String id) Agent\\n        +getAgentsAt(Location location) List~Agent~\\n        +hasOperationalCommunication() boolean\\n        +getEnvironment() Environment\\n        +getResourceManager() ResourceManager\\n        +submitMission(Mission mission, List~Agent~ agents) SubmissionResult\\n        +getActiveMission() Mission\\n        +getMissionHistory() List~Mission~\\n        +failActiveMission(String reason) boolean\\n        +changeEnvironment(EnvironmentCondition condition) void\\n        +tick() void\\n        +log(String message) void\\n        +getEventLog() List~String~\\n    }\\n    MarsColony *-- ResourceManager\\n\\n    class Emergency {\\n        &amp;lt;&amp;lt;abstract&amp;gt;&amp;gt;\\n        +String RESPONSIBILITY = \\&amp;quot;Critical event requiring immediate response and resources.\\&amp;quot;\\n        -id : String\\n        -type : EmergencyType\\n        -location : Location\\n        -state : EmergencyState\\n        -reason : String\\n        -responders : List~Agent~\\n        #Emergency(String id, EmergencyType type, Location location)\\n        +getId() String\\n        +getType() EmergencyType\\n        +getLocation() Location\\n        +getState() EmergencyState\\n        +getReason() String\\n        +getResponders() List~Agent~\\n        +describe() String\\n        +getRequiredResponderCapabilities()* List~Capability~\\n        +getResponseResources()* ResourceRequirement\\n        #applyInitialEffects(MarsColony colony)* void\\n        #applyResolution(MarsColony colony)* void\\n        #applyUnresolvedPenalty(MarsColony colony)* void\\n        #checkPreconditions(MarsColony colony) String\\n        #isExcluded(Agent agent) boolean\\n        ~setState(EmergencyState state, String reason) void\\n        ~addResponder(Agent agent) void\\n    }\\n\\n    class OxygenLeak {\\n        +OxygenLeak(String id, Habitat habitat, int oxygenLoss)\\n    }\\n    class Fire {\\n        +Fire(String id, Laboratory lab)\\n    }\\n    class RoverBreakdown {\\n        +RoverBreakdown(String id, ExplorationRover rover)\\n    }\\n    class MedicalEmergency {\\n        +MedicalEmergency(String id, CrewMember patient, int severity)\\n    }\\n    Emergency &amp;lt;|-- OxygenLeak\\n    Emergency &amp;lt;|-- Fire\\n    Emergency &amp;lt;|-- RoverBreakdown\\n    Emergency &amp;lt;|-- MedicalEmergency\\n\\n    class EmergencyManager {\\n        -colony : MarsColony\\n        -history : List~Emergency~\\n        +EmergencyManager(MarsColony colony)\\n        +handle(Emergency emergency) Emergency\\n        +getHistory() List~Emergency~\\n        +getUnresolved() List~Emergency~\\n    }\\n\\n    class Simulation {\\n        +String RESPONSIBILITY = \\&amp;quot;Time management engine for the colony ecosystem.\\&amp;quot;\\n        -colony : MarsColony\\n        -emergencyManager : EmergencyManager\\n        -currentTime : int\\n        -envChanges : List~ScheduledEnvChange~\\n        -emergencies : List~ScheduledEmergency~\\n        +Simulation(MarsColony colony)\\n        +getColony() MarsColony\\n        +getEmergencyManager() EmergencyManager\\n        +getCurrentTime() int\\n        +scheduleEnvironmentChange(int atTime, EnvironmentCondition condition) void\\n        +scheduleEmergency(int atTime, Emergency emergency) void\\n        +triggerEmergency(Emergency emergency) void\\n        +advanceTime(int units) void\\n        +advanceOneUnit() void\\n        +report() String\\n    }\\n    Simulation *-- EmergencyManager\\n    Simulation --&amp;gt; MarsColony\\n\\n    %% External Stubs for Cross-Relationships\\n    class Agent { &amp;lt;&amp;lt;interface&amp;gt;&amp;gt; }\\n    class Facility { &amp;lt;&amp;lt;abstract&amp;gt;&amp;gt; }\\n    class Location { &amp;lt;&amp;lt;interface&amp;gt;&amp;gt; }\\n    class Environment\\n\\n    MarsColony o-- \\&amp;quot;1..*\\&amp;quot; Agent\\n    MarsColony o-- \\&amp;quot;1..*\\&amp;quot; Facility\\n    MarsColony *-- Environment\\n    MarsColony --&amp;gt; \\&amp;quot;0..1\\&amp;quot; Mission : activeMission\\n\\n    AbstractMission --&amp;gt; \\&amp;quot;0..*\\&amp;quot; Agent : assignedAgents\\n    AbstractMission --&amp;gt; \\&amp;quot;0..*\\&amp;
